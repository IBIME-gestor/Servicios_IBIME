name: Publicar IBIME en Firebase

# Se ejecuta solo, automáticamente, cada vez que subes/actualizas archivos
# en la rama "main" desde la página de GitHub. No requiere que nadie corra
# nada en su computadora ni abra una terminal.
on:
  push:
    branches: [main]

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app (con tus credenciales guardadas como secretos)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WORKSPACE_DOMAIN: ${{ secrets.VITE_WORKSPACE_DOMAIN }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_APPSCRIPT_URL: ${{ secrets.VITE_APPSCRIPT_URL }}

      - name: Guardar la llave de servicio de Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/firebase-key.json"

      - name: Publicar en Firebase Hosting y subir reglas de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-key.json
        run: npx firebase-tools deploy --only hosting,firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive
